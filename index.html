      <script type="text/javascript">
         const workerUrl = "https://weather.vggbg.workers.dev/";
         const defaultCity = "София, България";
         
         const widget = document.createElement("div");
         widget.id = "weather-widget";
         
         const isMobile = window.innerWidth <= 768;
         const widgetWidth = isMobile ? 260 : 150;
         
         widget.style.width = widgetWidth + "px";
         widget.style.backgroundColor = "#ffffff";
         widget.style.borderRadius = "12px";
         widget.style.padding = isMobile ? "12px" : "15px";
         widget.style.cursor = "move";
         widget.style.resize = "both";
         widget.style.overflow = "hidden";
         widget.style.position = "fixed";
         widget.style.zIndex = "100";
         widget.style.maxWidth = "90vw";
         widget.style.maxHeight = "80vh";
         widget.style.overflowY = "auto";
         widget.style.boxShadow = "0 4px 20px rgba(0, 0, 0, 0.15), 0 8px 40px rgba(0, 0, 0, 0.10)";
         widget.style.transition = "box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1)";
         
         // Задаваме първоначалната позиция на уиджета - точно под картинката
         setTimeout(() => {
             const icon = document.querySelector('.login-icon');
             if (icon) {
                 const rect = icon.getBoundingClientRect();
                 widget.style.top = (rect.bottom + 30) + "px";
                 widget.style.left = "50%";
                 widget.style.transform = "translateX(-50%)";
             } else {
                 widget.style.top = "50%";
                 widget.style.left = "50%";
                 widget.style.transform = "translate(-50%, -50%)";
             }
         }, 50);
         
         document.body.appendChild(widget);
         
         widget.innerHTML = `
             <div id="weather-content" style="text-align: center; position: relative;">
                 <button id="close-widget" style="position: absolute; top: 5px; right: 5px; border: none; background-color: transparent; cursor: pointer; font-size: 18px;">&#10005;</button>
                 <h3 id="city" style="margin: 5px 0; color: #333;">Зареждане...</h3>
                 <p id="temperature" style="margin: 5px 0; color: #555;"></p>
                 <div id="weather-animation" style="font-size: 50px; width: 150px; height: auto; margin: 10px auto;"></div>
                 <p id="feels-like" style="margin: 5px 0; color: #555;"></p>
                 <input id="location-input" type="text" placeholder="Въведи град" style="width: 90%; padding: 8px; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; font-family: 'Arsenal', sans-serif;">
                 <button id="check-weather" style="margin-top: 10px; padding: 10px; border: none; border-radius: 5px; background-color: #ea5737; color: white; cursor: pointer; font-family: 'Arsenal', sans-serif; width: 100%;">Провери времето</button>
             </div>
         `;
         
         // Hover ефект само върху сянката на уиджета
         widget.addEventListener("mouseenter", () => {
             widget.style.boxShadow = "0 8px 30px rgba(0, 0, 0, 0.25), 0 12px 50px rgba(0, 0, 0, 0.20)";
         });
         
         widget.addEventListener("mouseleave", () => {
             widget.style.boxShadow = "0 4px 20px rgba(0, 0, 0, 0.15), 0 8px 40px rgba(0, 0, 0, 0.10)";
         });
         
         document.getElementById("close-widget").addEventListener("click", () => widget.remove());
         
         document.addEventListener("keydown", (e) => {
             if (e.key === "Escape" && document.getElementById("weather-widget")) {
                 widget.remove();
             }
         });
         
         const animationMapping = {
             "01d": "☀️", 
             "01n": "🌙", 
             "02d": "⛅", 
             "02n": "🌤",
             "03d": "☁️",
             "03n": "☁️",
             "09d": "💧",
             "09n": "💧",
             "10d": "🌦️",
             "10n": "🌦️",
             "11d": "⚡",
             "11n": "⚡",
             "13d": "❄️",
             "13n": "❄️",
             "50d": "🌫️",
             "50n": "🌫️",
         };
         
         async function getWeather(city) {
             try {
                 const response = await fetch(`${workerUrl}?city=${encodeURIComponent(city)}`);
                 if (!response.ok) throw new Error("Неуспешно зареждане");
                 const data = await response.json();
         
                 document.getElementById("city").innerText = data.name;
                 document.getElementById("temperature").innerHTML = `В момента е: <strong>${data.main.temp}°C</strong>`;
         
                 const weatherAnimation = animationMapping[data.weather[0].icon] || "⛅";
                 const animationDiv = document.getElementById("weather-animation");
                 animationDiv.innerHTML = weatherAnimation;
         
                 document.getElementById("feels-like").innerHTML = `Чувство: <strong>${data.main.feels_like}°C</strong>`;
             } catch (error) {
                 document.getElementById("city").innerText = "Грешка при зареждане!";
                 console.error(error);
             }
         }
         
         function getLocation() {
             if (navigator.geolocation) {
                 navigator.geolocation.getCurrentPosition(
                     (position) => {
                         const lat = position.coords.latitude;
                         const lon = position.coords.longitude;
                         fetch(`${workerUrl}?lat=${lat}&lon=${lon}`)
                             .then((response) => response.json())
                             .then((data) => {
                                 document.getElementById("city").innerText = data.name;
                                 document.getElementById("temperature").innerHTML = `В момента е: <strong>${data.main.temp}°C</strong>`;
         
                                 const weatherAnimation = animationMapping[data.weather[0].icon] || "⛅";
                                 const animationDiv = document.getElementById("weather-animation");
                                 animationDiv.innerHTML = weatherAnimation;
         
                                 document.getElementById("feels-like").innerHTML = `Чувство: <strong>${data.main.feels_like}°C</strong>`;
                             })
                             .catch(() => getWeather(defaultCity));
                     },
                     () => getWeather(defaultCity)
                 );
             } else {
                 getWeather(defaultCity);
             }
         }
         
         let isDragging = false;
         let dragOffsetX = 0;
         let dragOffsetY = 0;
         
         widget.addEventListener("mousedown", (e) => {
             if (e.target.closest("button") || e.target.tagName === "INPUT") return;
             isDragging = true;
             const rect = widget.getBoundingClientRect();
             dragOffsetX = e.clientX - rect.left;
             dragOffsetY = e.clientY - rect.top;
             widget.style.cursor = "grabbing";
             e.preventDefault();
         });
         
         document.addEventListener("mousemove", (e) => {
             if (!isDragging) return;
             widget.style.left = (e.clientX - dragOffsetX) + "px";
             widget.style.top = (e.clientY - dragOffsetY) + "px";
             widget.style.transform = "none";
         });
         
         document.addEventListener("mouseup", () => {
             if (isDragging) {
                 isDragging = false;
                 widget.style.cursor = "move";
             }
         });
         
         let touchOffsetX = 0, touchOffsetY = 0;
         let isTouchDragging = false;
         
         widget.addEventListener("touchstart", (e) => {
             if (e.target.closest("button") || e.target.tagName === "INPUT") return;
             const touch = e.touches[0];
             if (!touch) return;
             const rect = widget.getBoundingClientRect();
             touchOffsetX = touch.clientX - rect.left;
             touchOffsetY = touch.clientY - rect.top;
             isTouchDragging = true;
             widget.style.transform = "none";
         }, { passive: true });
         
         document.addEventListener("touchmove", (e) => {
             if (!isTouchDragging) return;
             const touch = e.touches[0];
             if (!touch) return;
             widget.style.left = (touch.clientX - touchOffsetX) + "px";
             widget.style.top = (touch.clientY - touchOffsetY) + "px";
             e.preventDefault();
         }, { passive: false });
         
         document.addEventListener("touchend", () => {
             if (isTouchDragging) {
                 isTouchDragging = false;
                 touchOffsetX = 0;
                 touchOffsetY = 0;
             }
         }, { passive: true });
         
         widget.ondragstart = () => false;
         
         document.getElementById("check-weather").addEventListener("click", () => {
             const city = document.getElementById("location-input").value.trim();
             if (city) {
                 getWeather(city);
             } else {
                 alert("Моля, въведете валидно местоположение!");
             }
         });
         
         document.getElementById("location-input").addEventListener("keydown", (e) => {
             if (e.key === "Enter") {
                 document.getElementById("check-weather").click();
             }
         });
         
         const locationInput = document.getElementById("location-input");
         locationInput.addEventListener("focus", () => {
             locationInput.style.boxShadow = "0 0 10px rgba(234, 87, 55, 0.8)";
         });
         locationInput.addEventListener("blur", () => {
             locationInput.style.boxShadow = "0 0 5px rgba(53, 174, 255, 0.5)";
         });
         
         getLocation();
         setInterval(() => getWeather(defaultCity), 15 * 60 * 1000);
      </script>
