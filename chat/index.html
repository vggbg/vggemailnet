<!doctype html>
<html lang="bg">
    <head>
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>"
        />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Чат</title>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.18.1/index.js"></script>
        <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    "Noto Sans",
                    "Ubuntu",
                    sans-serif;
                -webkit-tap-highlight-color: transparent;
                user-select: none;
            }
            html {
                height: 100%;
            }
            body {
                background: #ffffff;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 40px 20px;
                height: 100%;
                overflow: hidden;
            }
            body.is-iframe {
                align-items: flex-start;
            }

            .container {
                background: #ffffff;
                border-radius: 8px;
                max-width: 800px;
                width: 100%;
                display: flex;
                flex-direction: column;
                box-shadow:
                    0 12px 28px rgba(0, 0, 0, 0.1),
                    0 4px 12px rgba(0, 0, 0, 0.06);
                border: 1px solid #eaeaea;
                height: auto;
                min-height: 400px;
                max-height: min(750px, calc(100vh - 80px));
                position: relative;
                overflow: hidden;
            }

            .chat-header {
                background: #ffffff;
                padding: 12px 20px;
                border-bottom: 1px solid #eaeaea;
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-shrink: 0;
                gap: 8px;
                flex-wrap: wrap;
            }
            .room-info h1 {
                font-size: 1.1rem;
                color: #222;
                margin: 0;
                display: flex;
                align-items: center;
                gap: 6px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .online-count {
                font-size: 0.75rem;
                font-weight: 400;
                color: #999;
            }
            .header-actions {
                display: none;
                gap: 8px;
                flex-shrink: 0;
                align-items: center;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .action-btn {
                background: #f0f0f0;
                border: 1px solid #ddd;
                color: #333;
                border-radius: 8px;
                padding: 7px 12px;
                font-size: 0.8rem;
                font-weight: 600;
                cursor: pointer;
                transition: 0.15s;
                display: none;
                align-items: center;
                gap: 5px;
            }
            .action-btn:hover {
                background: #e8e8e8;
            }

            .tg-status {
                display: none;
                font-size: 1.1rem;
                font-weight: 600;
                white-space: nowrap;
                align-items: center;
                gap: 4px;
                background: none;
                border: none;
                cursor: pointer;
                padding: 7px;
                font-family: inherit;
                line-height: 1;
            }
            .tg-status iconify-icon {
                pointer-events: none;
            }
            .tg-status.enabled {
                color: #1a8f4e;
                transition: 0.15s;
            }
            .tg-status.enabled:hover {
                color: #15703d;
            }
            .tg-status.disabled {
                color: #888;
                transition: 0.15s;
            }
            .tg-status.disabled:hover {
                color: #555;
            }

            .login-section {
                padding: 2.5rem 2rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                flex: 1;
                gap: 12px;
            }
            .login-title {
                color: #222;
                font-size: 1.15rem;
                font-weight: 700;
                text-align: center;
                margin-bottom: 4px;
            }
            .login-subtitle {
                color: #777;
                font-size: 0.9rem;
                text-align: center;
            }
            .login-hint {
                color: #999;
                font-size: 0.8rem;
                text-align: center;
                margin-top: -8px;
            }
            .error-text {
                color: #e05a4f;
                font-weight: 600;
            }

            .login-input {
                width: 100%;
                max-width: 300px;
                padding: 11px 18px;
                border: 1px solid #ddd;
                border-radius: 8px;
                font-size: 0.95rem;
                color: #222;
                background: #fff;
                outline: none;
                text-align: center;
                transition: 0.15s;
                height: 44px;
                font-family: inherit;
            }
            .login-input:focus {
                border-color: #4d9de0;
            }
            .login-btn {
                background: #4d9de0;
                border: none;
                border-radius: 8px;
                padding: 11px 24px;
                font-size: 0.95rem;
                font-weight: 600;
                color: #fff;
                cursor: pointer;
                transition: 0.15s ease;
                height: 44px;
            }
            .login-btn:hover {
                background: #3a8ad0;
            }
            .login-btn:disabled {
                background: #ccc;
                pointer-events: none;
            }

            .key-gen-row {
                display: flex;
                gap: 8px;
                width: 100%;
                max-width: 300px;
                align-items: center;
            }
            .key-gen-btn {
                background: #1a8f4e;
                border: none;
                color: white;
                border-radius: 8px;
                padding: 0 16px;
                height: 44px;
                cursor: pointer;
                font-size: 0.85rem;
                font-weight: 600;
                white-space: nowrap;
                transition: 0.15s;
            }
            .key-gen-btn:hover {
                background: #15703d;
            }

            .login-input-wrapper {
                position: relative;
                width: 100%;
                max-width: 300px;
            }
            .key-gen-row .login-input-wrapper {
                flex: 1;
            }

            input[type="password"].login-input {
                font-family: inherit;
                letter-spacing: 1px;
            }
            input[type="password"].login-input::placeholder {
                font-family: inherit;
                letter-spacing: normal;
                font-size: 0.9rem;
            }
            .toggle-pass-btn {
                position: absolute;
                right: 10px;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                cursor: pointer;
                color: #888;
                padding: 5px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .toggle-pass-btn:hover {
                color: #555;
            }

            .chat-section {
                display: none;
                flex-direction: column;
                flex: 1;
                min-height: 0;
            }
            .chat-section.active {
                display: flex;
            }

            .chat-messages {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 4px;
                padding: 15px;
                overflow-y: auto;
                overflow-x: hidden;
                background: #ffffff;
                user-select: text;
                min-height: 0;
                -webkit-overflow-scrolling: touch;
            }

            .message-row {
                max-width: 75%;
                padding: 8px 12px 6px 12px;
                border-radius: 12px 12px 12px 4px;
                background: #f0f0f0;
                align-self: flex-start;
                position: relative;
                word-wrap: break-word;
                animation: fadeIn 0.2s ease;
                user-select: text;
            }
            .message-row.self {
                background: #e3f2fd;
                border-radius: 12px 12px 4px 12px;
                align-self: flex-end;
            }

            .msg-header {
                display: flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 3px;
            }
            .msg-nickname {
                font-weight: 700;
                font-size: 0.85rem;
                color: #4d9de0;
                flex-shrink: 0;
            }
            .message-row.self .msg-nickname {
                color: #2980b9;
            }
            .msg-time {
                font-size: 0.7rem;
                color: #999;
                flex-shrink: 0;
            }
            .msg-spacer {
                flex: 1;
            }
            .msg-action-btn {
                background: none;
                border: none;
                cursor: pointer;
                font-size: 0.72rem;
                color: #bbb;
                padding: 2px 3px;
                opacity: 0;
                transition: 0.15s;
                flex-shrink: 0;
                border-radius: 4px;
                line-height: 1;
            }
            .message-row:hover .msg-action-btn {
                opacity: 1;
            }
            .msg-action-btn:hover {
                color: #555;
            }
            .msg-delete-btn:hover {
                color: #e05a4f;
            }
            .msg-reply-btn:hover {
                color: #4d9de0;
            }

            .msg-text {
                font-size: 0.95rem;
                color: #222;
                line-height: 1.35;
                user-select: text;
            }

            /* Стилове за текстови линкове */
            .msg-text a {
                color: #4d9de0;
                text-decoration: underline;
                word-break: break-word;
            }
            .message-row.self .msg-text a {
                color: #2980b9;
            }
            .msg-text a:hover {
                opacity: 0.8;
            }

            /* Стилове за преглед на обикновени линкове */
            .msg-link-preview {
                display: flex;
                align-items: flex-start;
                gap: 10px;
                margin-top: 8px;
                padding: 10px;
                border-radius: 8px;
                border: 1px solid #e0e0e0;
                background: #fff;
                text-decoration: none;
                color: inherit;
                max-width: 100%;
                transition: 0.15s;
            }
            .msg-link-preview:hover {
                background: #f8f8f8;
                border-color: #bbb;
            }
            .message-row.self .msg-link-preview {
                background: #fafcff;
            }
            .msg-link-preview .lp-icon {
                width: 32px;
                height: 32px;
                flex-shrink: 0;
                object-fit: contain;
                border-radius: 4px;
                background: #f0f0f0;
            }
            .msg-link-preview .lp-content {
                flex: 1;
                min-width: 0;
            }
            .msg-link-preview .lp-title {
                font-weight: 600;
                font-size: 0.9rem;
                color: #222;
                margin-bottom: 2px;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .msg-link-preview .lp-domain {
                font-size: 0.75rem;
                color: #888;
            }

            /* Стилове за YouTube преглед */
            .msg-youtube {
                display: block;
                position: relative;
                margin-top: 8px;
                border-radius: 8px;
                overflow: hidden;
                background: #000;
                text-decoration: none;
                width: 100%;
                min-width: 220px;
            }
            .msg-youtube img {
                width: 100%;
                display: block;
                aspect-ratio: 16 / 9;
                object-fit: cover;
            }
            .msg-youtube .play-icon {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 50px;
                height: 50px;
                background: rgba(255, 0, 0, 0.85);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                pointer-events: none;
            }
            .msg-youtube .play-icon::after {
                content: "";
                display: block;
                border-style: solid;
                border-width: 9px 0 9px 16px;
                border-color: transparent transparent transparent #fff;
                margin-left: 3px;
            }

            .msg-image {
                max-width: 100%;
                border-radius: 8px;
                margin-top: 5px;
                cursor: pointer;
                display: block;
            }

            .msg-reply {
                background: rgba(0, 0, 0, 0.05);
                border-left: 3px solid #4d9de0;
                border-radius: 4px;
                padding: 3px 8px;
                margin-bottom: 4px;
                overflow: hidden;
            }
            .message-row.self .msg-reply {
                border-left-color: #2980b9;
                background: rgba(0, 0, 0, 0.04);
            }
            .msg-reply-nick {
                font-weight: 700;
                font-size: 0.75rem;
                color: #4d9de0;
                display: block;
                margin-bottom: 1px;
            }
            .msg-reply-text {
                font-size: 0.78rem;
                color: #666;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                display: block;
            }

            .msg-file {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 8px 12px;
                background: rgba(0, 0, 0, 0.06);
                border-radius: 8px;
                color: #2980b9;
                text-decoration: none;
                font-size: 0.85rem;
                margin-top: 4px;
                transition: 0.15s;
                max-width: 100%;
                word-break: break-all;
            }
            .msg-file:hover {
                background: rgba(0, 0, 0, 0.1);
            }
            .message-row.self .msg-file {
                color: #1a6db5;
            }

            .reply-bar {
                display: none;
                align-items: center;
                padding: 6px 14px;
                background: #f0f7ff;
                border-top: 1px solid #d0e3f7;
                gap: 8px;
                flex-shrink: 0;
            }
            .reply-bar-content {
                flex: 1;
                min-width: 0;
                overflow: hidden;
            }
            .reply-bar-nick {
                font-weight: 700;
                font-size: 0.78rem;
                color: #2980b9;
                display: block;
            }
            .reply-bar-text {
                font-size: 0.78rem;
                color: #555;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                display: block;
            }
            .reply-bar-close {
                background: none;
                border: none;
                font-size: 1rem;
                cursor: pointer;
                color: #999;
                flex-shrink: 0;
                padding: 4px;
            }
            .reply-bar-close:hover {
                color: #333;
            }

            .typing-indicator {
                display: none;
                align-items: center;
                gap: 6px;
                padding: 3px 15px;
                font-size: 0.72rem;
                color: #999;
                flex-shrink: 0;
            }
            .typing-dots {
                display: flex;
                gap: 3px;
            }
            .typing-dots span {
                width: 5px;
                height: 5px;
                background: #bbb;
                border-radius: 50%;
                animation: typingBounce 1.2s ease-in-out infinite;
            }
            .typing-dots span:nth-child(2) {
                animation-delay: 0.15s;
            }
            .typing-dots span:nth-child(3) {
                animation-delay: 0.3s;
            }

            .chat-input-area {
                display: flex;
                gap: 6px;
                padding: 10px 12px;
                background: #ffffff;
                border-top: 1px solid #eaeaea;
                flex-shrink: 0;
                align-items: center;
            }
            .input-action-btn {
                background: none;
                border: none;
                font-size: 1.2rem;
                cursor: pointer;
                padding: 0;
                border-radius: 50%;
                transition: 0.15s;
                opacity: 0.6;
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 34px;
                height: 34px;
            }
            .input-action-btn:hover {
                opacity: 1;
                background: #f0f0f0;
            }
            .chat-input {
                flex: 1;
                min-width: 0;
                padding: 10px 14px;
                border: 1px solid #ddd;
                border-radius: 20px;
                font-size: 0.95rem;
                color: #222;
                background: #f9f9f9;
                outline: none;
            }
            .chat-input:focus {
                border-color: #4d9de0;
                background: #fff;
            }
            .send-btn {
                background: #4d9de0;
                border: none;
                color: #fff;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
                cursor: pointer;
                transition: 0.15s ease;
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .send-btn:hover {
                background: #3a8ad0;
            }
            .send-btn:active {
                transform: scale(0.9);
            }
            .send-btn:disabled {
                background: #ccc;
                pointer-events: none;
            }

            #emojiPickerWrapper {
                position: absolute;
                bottom: 65px;
                left: 12px;
                z-index: 100;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
                display: none;
                background: #fff;
                width: calc(100% - 24px);
                max-width: 350px;
                flex-direction: column;
            }
            #emojiPickerWrapper.open {
                display: flex;
            }
            emoji-picker {
                width: 100%;
                height: 300px;
                flex-shrink: 0;
                border: none;
                --num-columns: 8;
                --emoji-padding: 0.5rem;
            }

            .lightbox {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 2000;
                display: none;
                align-items: center;
                justify-content: center;
            }
            .lightbox.open {
                display: flex;
            }
            .lightbox-overlay {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.88);
                animation: fadeIn 0.2s ease;
            }
            .lightbox-img {
                position: relative;
                max-width: 95%;
                max-height: 92vh;
                object-fit: contain;
                border-radius: 6px;
                animation: lbZoom 0.25s ease;
            }
            .lightbox-close {
                position: absolute;
                top: 12px;
                right: 12px;
                background: rgba(255, 255, 255, 0.12);
                color: #fff;
                border: none;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                font-size: 1.3rem;
                cursor: pointer;
                z-index: 1;
                transition: 0.15s;
            }
            .lightbox-close:hover {
                background: rgba(255, 255, 255, 0.25);
            }

            .toast {
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                background: #333;
                color: white;
                padding: 10px 24px;
                border-radius: 8px;
                font-size: 0.9rem;
                font-weight: 600;
                z-index: 3000;
                opacity: 0;
                transition: opacity 0.3s ease;
                pointer-events: none;
                white-space: nowrap;
            }
            .toast.show {
                opacity: 1;
            }

            .chat-footer {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px 15px;
                border-top: 1px solid #eaeaea;
                background: #fafafa;
                flex-shrink: 0;
                font-size: 0.75rem;
                color: #888;
            }
            .footer-date {
                font-weight: 500;
            }
            .footer-actions {
                display: flex;
                gap: 15px;
            }
            .footer-link-btn {
                background: none;
                border: none;
                color: #4d9de0;
                cursor: pointer;
                padding: 0;
                font-size: 0.75rem;
                font-family: inherit;
                text-decoration: none;
                transition: 0.15s;
            }
            .footer-link-btn:hover {
                color: #3a8ad0;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }
            @keyframes typingBounce {
                0%,
                60%,
                100% {
                    transform: translateY(0);
                    opacity: 0.4;
                }
                30% {
                    transform: translateY(-4px);
                    opacity: 1;
                }
            }
            @keyframes lbZoom {
                from {
                    transform: scale(0.9);
                    opacity: 0;
                }
                to {
                    transform: scale(1);
                    opacity: 1;
                }
            }

            @media (max-width: 480px) {
                body {
                    padding: 0;
                    align-items: flex-start;
                }
                .container {
                    height: 100dvh;
                    max-height: none;
                    border-radius: 0;
                    border: none;
                    box-shadow: none;
                }
                .chat-header {
                    padding: 8px 12px;
                    gap: 6px;
                }
                .header-actions {
                    gap: 5px;
                }
                .btn-text {
                    display: none;
                }
                .action-btn {
                    padding: 7px 8px;
                    font-size: 0;
                }
                .tg-status {
                    font-size: 1.1rem;
                }
                .chat-messages {
                    padding: 10px;
                }
                .chat-input-area {
                    padding: 8px 10px;
                    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
                    gap: 3px;
                }
                .input-action-btn {
                    width: 30px;
                    height: 30px;
                    font-size: 1.05rem;
                }
                .chat-input {
                    padding: 8px 12px;
                    font-size: 0.9rem;
                }
                .send-btn {
                    width: 36px;
                    height: 36px;
                    font-size: 1rem;
                }
                .msg-action-btn {
                    opacity: 0.35;
                }
                #emojiPickerWrapper {
                    left: 8px;
                    right: 8px;
                    bottom: 60px;
                    width: auto;
                    max-width: none;
                }
                emoji-picker {
                    height: 250px;
                }
                .login-section {
                    padding: 2rem 1.5rem;
                    gap: 10px;
                }
                .chat-footer {
                    padding: 6px 12px;
                    padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
                    font-size: 0.7rem;
                }
                .footer-actions {
                    gap: 10px;
                }
                .footer-link-btn {
                    font-size: 0.7rem;
                }
            }

            @supports not (height: 100dvh) {
                @media (max-width: 480px) {
                    .container {
                        height: 100vh;
                        height: -webkit-fill-available;
                    }
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="chat-header">
                <div class="room-info">
                    <h1 id="roomLinkDisplay">💬<span class="online-count" id="onlineCount"></span></h1>
                </div>
                <div class="header-actions" id="headerActions">
                    <button class="action-btn" id="tgBtn" type="button" title="Известия">
                        <iconify-icon icon="mdi:telegram" width="15"></iconify-icon>
                        <span class="btn-text">известия</span>
                    </button>
                    <button class="tg-status" id="tgStatus" type="button"></button>
                    <button class="action-btn" id="logoutBtn" type="button" title="Отписване">
                        <iconify-icon icon="mdi:logout" width="15"></iconify-icon>
                        <span class="btn-text">Отписване</span>
                    </button>
                </div>

            function generateSecurePassword(length = 20) {
                const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
                const array = new Uint32Array(length);
                crypto.getRandomValues(array);
                return Array.from(array, (x) => chars[x % chars.length]).join("");
            }

            function arrayBufferToBase64(buffer) {
                let binary = "";
                const bytes = new Uint8Array(buffer);
                bytes.forEach((b) => (binary += String.fromCharCode(b)));
                return btoa(binary);
            }

            function base64ToArrayBuffer(base64) {
                const binary = atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                return bytes.buffer;
            }

            async function deriveKey(pass, room) {
                const enc = new TextEncoder();
                const salt = enc.encode("chat-e2ee-salt:" + room);
                const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, [
                    "deriveKey",
                ]);
                return await crypto.subtle.deriveKey(
                    { name: "PBKDF2", salt: salt, iterations: 600000, hash: "SHA-256" },
                    keyMaterial,
                    { name: "AES-GCM", length: 256 },
                    false,
                    ["encrypt", "decrypt"]
                );
            }

            async function encryptText(text, key) {
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const encodedText = new TextEncoder().encode(text);
                const cipherBuffer = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encodedText);
                const combined = new Uint8Array(iv.length + cipherBuffer.byteLength);
                combined.set(iv, 0);
                combined.set(new Uint8Array(cipherBuffer), iv.length);
                return arrayBufferToBase64(combined.buffer);
            }

            async function decryptText(base64Payload, key) {
                try {
                    const combined = new Uint8Array(base64ToArrayBuffer(base64Payload));
                    const iv = combined.slice(0, 12);
                    const cipherText = combined.slice(12);
                    const decryptedBuffer = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipherText);
                    return new TextDecoder().decode(decryptedBuffer);
                } catch (e) {
                    return null;
                }
            }

            async function encryptFile(file, key) {
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const fileBuffer = await file.arrayBuffer();
                const cipherBuffer = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, fileBuffer);
                return { encryptedBlob: new Blob([cipherBuffer]), ivBase64: arrayBufferToBase64(iv.buffer) };
            }

            async function decryptFile(fileDataJson, key) {
                const fileData = JSON.parse(fileDataJson);
                const response = await fetch(fileData.url);
                const encryptedBuffer = await response.arrayBuffer();
                const iv = new Uint8Array(base64ToArrayBuffer(fileData.iv));
                const decryptedBuffer = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, encryptedBuffer);
                const blob = new Blob([decryptedBuffer], { type: fileData.originalType });
                return URL.createObjectURL(blob);
            }

                        textArea.style.position = "fixed";
                        textArea.style.left = "-999999px";
                        textArea.style.top = "-999999px";

                        try {

                if (typingIndicator.style.display !== "none") b += typingIndicator.offsetHeight;
                return b + "px";
            }
            emojiBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                emojiPickerWrapper.style.bottom = getEmojiPickerBottom();
                emojiPickerWrapper.classList.toggle("open");
            });
            document.addEventListener("click", (e) => {
                if (!emojiPickerWrapper.contains(e.target) && e.target !== emojiBtn)
                    emojiPickerWrapper.classList.remove("open");
            });
            emojiPicker.addEventListener("emoji-click", (event) => {
                const emoji = event.detail.unicode;
                messageInput.value += emoji;
                messageInput.focus();
                emojiPickerWrapper.classList.remove("open");
            });

            attachBtn.addEventListener("click", () => {
                fileInput.removeAttribute("capture");
                fileInput.click();
            });
            cameraBtn.addEventListener("click", () => {
                fileInput.setAttribute("capture", "environment");
                fileInput.click();
            });

            fileInput.addEventListener("change", async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > MAX_FILE_SIZE) {
                    const mb = (MAX_FILE_SIZE / 1024 / 1024).toFixed(0);
                    showToast("❌ Файлът е твърде голям (макс. " + mb + "MB)");
                    fileInput.value = "";
                    return;
                }

                sendBtn.disabled = true;
                showToast("⏳ Качване...");

                const isImage = file.type.startsWith("image/");
                const ext = file.name.split(".").pop() || "bin";
                const storagePath =
                    roomId + "/" + Date.now() + "-" + Math.random().toString(36).substring(2, 6) + "." + ext;

                try {
                    let finalFileUrl = "";
                    const msgText = isImage ? "" : "📄 " + file.name;

                    if (encryptionKey) {
                        const { encryptedBlob, ivBase64 } = await encryptFile(file, encryptionKey);
                        const { error: uploadErr } = await db.storage
                            .from("chat-files")
                            .upload(storagePath, encryptedBlob, { contentType: "application/octet-stream" });
                        if (uploadErr) throw uploadErr;
                        const { data: urlData } = db.storage.from("chat-files").getPublicUrl(storagePath);
                        finalFileUrl = JSON.stringify({
                            url: urlData.publicUrl,
                            iv: ivBase64,
                            originalName: file.name,
                            originalType: file.type,
                        });
                    } else {
                        const { error: uploadErr } = await db.storage.from("chat-files").upload(storagePath, file);
                        if (uploadErr) throw uploadErr;
                        const { data: urlData } = db.storage.from("chat-files").getPublicUrl(storagePath);
                        finalFileUrl = urlData.publicUrl;
                    }

                    const { data, error } = await db.rpc("send_message", {
                        p_payload: {
                            room: roomId,
                            nickname: currentUser,
                            text: msgText,
                            reply_nick: replyTo?.nick || null,
                            reply_text: null,
                            file_url: finalFileUrl,
                            is_image: isImage,
                        },
                    });

                    if (error) throw error;
                    if (data?.length) {
                        processedIds.add(data[0].id);
                        addMessageToScreen(data[0]);
                    }
                } catch (err) {
                    console.error("Upload error:", err);
                    showToast("Грешка при качване!");
                }

                fileInput.value = "";
                sendBtn.disabled = false;
                clearReply();
            });

            function openLightbox(src) {
                lightboxImg.src = src;
                lightbox.classList.add("open");
            }
            function closeLightbox() {
                lightbox.classList.remove("open");
                if (lightboxImg.src.startsWith("blob:")) {
                    URL.revokeObjectURL(lightboxImg.src);
                }
                lightboxImg.src = "";
            }
            lightboxOverlay.addEventListener("click", closeLightbox);
            lightboxClose.addEventListener("click", closeLightbox);
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") closeLightbox();
            });

            function setReply(nick, text) {
                replyTo = { nick, text };
                replyBarNick.textContent = nick;
                replyBarText.textContent = text.length > 60 ? text.substring(0, 60) + "..." : text;
                replyBar.style.display = "flex";
                messageInput.focus();
            }
            function clearReply() {
                replyTo = null;
                replyBar.style.display = "none";
            }
            replyBarClose.addEventListener("click", (e) => {
                e.stopPropagation();
                clearReply();
                messageInput.focus();
            });

            async function deleteMessage(id, row) {
                const { data: success, error } = await db.rpc("delete_message", {
                    p_id: id,
                    p_nickname: currentUser,
                });

                if (!error && success) {
                    row.style.transition = "0.3s";
                    row.style.opacity = "0";
                    row.style.transform = "scale(0.8)";
                    setTimeout(() => row.remove(), 300);
                } else {
                    showToast("Грешка при изтриване! Може да не сте автор.");
                }
            }

            function getTime(iso) {
                const d = new Date(iso);
                return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
            }

            // ФУНКЦИЯ ЗА ЛИНКОВЕ И YOUTUBE
            function formatMessageText(text) {
                // 1. Екранираме HTML за сигурност (предотвратява XSS)
                const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" };
                let escapedText = text.replace(/[&<>"']/g, (m) => map[m]);

                // 2. Заменяме новите редове с <br>
                escapedText = escapedText.replace(/\n/g, "<br>");

                // 3. Regex за намиране на URL адреси
                const urlRegex = /(https?:\/\/[^\s]+)/gi;

                // 4. Обработваме намерените линкове
                escapedText = escapedText.replace(urlRegex, (url) => {
                    // Премахваме евентуални препинателни знаци в края на линка
                    let cleanUrl = url.replace(/[.,!?;:]$/, "");

                    // Проверяваме дали е YouTube линк
                    const ytMatch = cleanUrl.match(
                        /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/
                    );

                    if (ytMatch && ytMatch[1]) {
                        const videoId = ytMatch[1];
                        return `<a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" rel="noopener noreferrer" class="msg-youtube"><img src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg" alt="YouTube Video"><div class="play-icon"></div></a>`;
                    } else {
                        // Слагаме маркер за обикновените линкове
                        return `<span class="link-placeholder" data-url="${cleanUrl}"><a href="${cleanUrl}" target="_blank" rel="noopener noreferrer">${cleanUrl}</a></span>`;
                    }
                });

                return escapedText;
            }

            // Наша собствена функция чрез Supabase Edge Function
            async function fetchLinkPreview(url, placeholderEl) {
                try {
                    // Извикваме нашата Edge Function
                    const { data, error } = await db.functions.invoke("link-preview", {
                        body: { url: url },
                    });

                    if (error || !data || (!data.title && !data.favicon)) return;

                    const card = document.createElement("a");
                    card.className = "msg-link-preview";
                    card.href = url;
                    card.target = "_blank";
                    card.rel = "noopener noreferrer";

                    let domain = "";
                    try {
                        domain = new URL(url).hostname.replace("www.", "");
                    } catch (e) {}

                    let htmlContent = "";
                    if (data.favicon) {
                        // Ако иконата се счупи, резервно копие (fallback) от Google
                        let fallbackIcon = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
                        htmlContent += `<img class="lp-icon" src="${data.favicon}" onerror="this.onerror=null;this.src='${fallbackIcon}';" alt="">`;
                    }

                    htmlContent += '<div class="lp-content">';
                    if (data.title) htmlContent += `<div class="lp-title">${data.title}</div>`;
                    if (domain) htmlContent += `<div class="lp-domain">${domain}</div>`;

                    htmlContent += "</div>";
                    card.innerHTML = htmlContent;

                    placeholderEl.replaceWith(card);
                } catch (e) {
                    console.log("Link preview error:", e);
                }
            }

            async function addMessageToScreen(msg) {
                if (msg.nickname === "Система") return;
                const isMe = msg.nickname === currentUser;
                const row = document.createElement("div");
                row.className = "message-row" + (isMe ? " self" : "");
                row.dataset.msgId = msg.id;

                let displayText = msg.text;
                let displayReplyText = msg.reply_text;
                let displayFileUrl = msg.file_url;

                if (encryptionKey) {
                    if (displayText) displayText = await decryptText(displayText, encryptionKey);
                    if (displayReplyText) displayReplyText = await decryptText(displayReplyText, encryptionKey);
                    if (displayFileUrl) {
                        try {
                            displayFileUrl = await decryptFile(displayFileUrl, encryptionKey);
                        } catch (e) {
                            displayFileUrl = null;
                        }
                    }

                    if (displayText === null && msg.text) displayText = "🔒 Грешка при дешифриране";
                    if (displayReplyText === null && msg.reply_text) displayReplyText = "🔒 Грешка при дешифриране";
                }

                const hdr = document.createElement("div");
                hdr.className = "msg-header";
                const nick = document.createElement("span");
                nick.className = "msg-nickname";
                nick.textContent = msg.nickname;
                const time = document.createElement("span");
                time.className = "msg-time";
                time.textContent = getTime(msg.created_at);
                const spacer = document.createElement("span");
                spacer.className = "msg-spacer";

                const rbtn = document.createElement("button");
                rbtn.className = "msg-action-btn msg-reply-btn";
                rbtn.innerText = "↩";
                rbtn.title = "Отговор";
                rbtn.onclick = (e) => {
                    e.stopPropagation();
                    setReply(msg.nickname, displayText || "📎 Файл");
                };

                hdr.append(nick, time, spacer, rbtn);
                if (isMe) {
                    const dbtn = document.createElement("button");
                    dbtn.className = "msg-action-btn msg-delete-btn";
                    dbtn.innerText = "✕";
                    dbtn.title = "Изтрий";
                    dbtn.onclick = (e) => {
                        e.stopPropagation();
                        deleteMessage(msg.id, row);
                    };
                    hdr.appendChild(dbtn);
                }
                row.appendChild(hdr);

                if (msg.reply_nick && displayReplyText) {
                    const rd = document.createElement("div");
                    rd.className = "msg-reply";
                    const rn = document.createElement("span");
                    rn.className = "msg-reply-nick";
                    rn.textContent = msg.reply_nick;
                    const rt = document.createElement("span");
                    rt.className = "msg-reply-text";
                    rt.textContent =
                        displayReplyText.length > 60 ? displayReplyText.substring(0, 60) + "..." : displayReplyText;
                    rd.append(rn, rt);
                    row.appendChild(rd);
                }

                if (msg.is_image && displayFileUrl) {
                    const img = document.createElement("img");
                    img.src = displayFileUrl;
                    img.className = "msg-image";
                    img.loading = "lazy";
                    img.onclick = () => openLightbox(displayFileUrl);
                    row.appendChild(img);
                } else if (!msg.is_image && displayFileUrl) {
                    const a = document.createElement("a");
                    a.className = "msg-file";
                    a.href = displayFileUrl;
                    a.download = (displayText || "").replace("📄 ", "") || "файл";
                    a.target = "_blank";
                    a.rel = "noopener";
                    a.textContent = displayText || "📎 Файл";
                    row.appendChild(a);
                }

                if (displayText && !msg.file_url) {
                    const td = document.createElement("div");
                    td.className = "msg-text";
                    td.innerHTML = formatMessageText(displayText);
                    row.appendChild(td);
                }

                if (msg.id && chatMessages.querySelector('[data-msg-id="' + msg.id + '"]')) {
                    return;
                }

                chatMessages.appendChild(row);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // Активираме генерирането на преглед за линковете
                if (displayText && !msg.file_url) {
                    row.querySelectorAll(".link-placeholder").forEach((ph) => {
                        const url = ph.getAttribute("data-url");
                        fetchLinkPreview(url, ph);
                    });
                }
            }

            async function loadMessages() {
                const { data, error } = await db
                    .from("messages")
                    .select("*")
                    .eq("room", roomId)
                    .order("created_at", { ascending: true })
                    .limit(100);
                if (!error && data) {
                    for (const msg of data) {
                        processedIds.add(msg.id);
                        await addMessageToScreen(msg);
                    }
                    if (data.length > 0) {
                        lastPollTimestamp = data[data.length - 1].created_at;
                    }
                }
            }

            let typingUsers = new Map();
            let typingHideTimer = null;
            let lastTypingSent = 0;

            function updateTypingUI() {
                if (typingUsers.size === 0) {
                    typingIndicator.style.display = "none";
                    return;
                }
                const names = [...typingUsers.keys()];
                typingText.textContent =
                    names.length === 1
                        ? names[0] + " пише..."
                        : names.slice(0, 2).join(" и ") + (names.length > 2 ? " и др." : "") + " пишат...";
                typingIndicator.style.display = "flex";
            }

            function listenForNewMessages() {
                if (realtimeChannel) db.removeChannel(realtimeChannel);

                realtimeChannel = db
                    .channel("room-" + roomId)
                    .on(
                        "postgres_changes",
                        { event: "INSERT", schema: "public", table: "messages", filter: "room=eq." + roomId },
                        (payload) => {
                            if (processedIds.has(payload.new.id)) {
                                processedIds.delete(payload.new.id);
                                return;
                            }
                            processedIds.add(payload.new.id);
                            if (
                                payload.new.created_at &&
                                (!lastPollTimestamp || payload.new.created_at > lastPollTimestamp)
                            ) {
                                lastPollTimestamp = payload.new.created_at;
                            }
                            addMessageToScreen(payload.new);
                        }
                    )
                    .on(
                        "postgres_changes",
                        { event: "DELETE", schema: "public", table: "messages", filter: "room=eq." + roomId },
                        (payload) => {
                            const deletedId = payload.old.id;
                            const rowToDelete = chatMessages.querySelector('[data-msg-id="' + deletedId + '"]');

                            if (rowToDelete) {
                                rowToDelete.style.transition = "0.3s";
                                rowToDelete.style.opacity = "0";
                                rowToDelete.style.transform = "scale(0.8)";
                                setTimeout(() => rowToDelete.remove(), 300);
                            }
                        }
                    )
                    .on(
                        "postgres_changes",
                        {
                            event: "*",
                            schema: "public",
                            table: "telegram_subs",
                            filter: "room=eq." + roomId + "&nickname=eq." + currentUser,
                        },
                        (payload) => {
                            if (payload.new && payload.new.enabled !== undefined) {
                                telegramEnabled = payload.new.enabled;
                                updateTelegramUI();
                            }
                        }
                    )
                    .on("broadcast", { event: "typing" }, (payload) => {
                        if (payload.payload.nickname === currentUser) return;
                        typingUsers.set(payload.payload.nickname, Date.now());
                        updateTypingUI();
                        if (typingHideTimer) clearTimeout(typingHideTimer);
                        typingHideTimer = setTimeout(() => {
                            typingUsers.clear();
                            updateTypingUI();
                        }, 3000);
                    })
                    .on("presence", { event: "sync" }, () => {
                        const state = realtimeChannel.presenceState();
                        const count = Object.keys(state).length;
                        const el = document.getElementById("onlineCount");
                        if (el) el.textContent = count > 1 ? "(" + count + " на линия)" : "";
                    })
                    .subscribe((status, err) => {
                        if (status === "SUBSCRIBED") {
                            realtimeChannel.track({ user: currentUser });
                        } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
                            console.warn("Realtime неуспешен (" + status + "), полингът ще поеме:", err);
                        }
                    });
            }

            messageInput.addEventListener("input", () => {
                const now = Date.now();
                if (now - lastTypingSent > 2000 && messageInput.value.trim() && realtimeChannel) {
                    lastTypingSent = now;
                    realtimeChannel.send({ type: "broadcast", event: "typing", payload: { nickname: currentUser } });
                }
            });

            async function sendMessage() {
                const text = messageInput.value.trim();
                if (!text) return;
                sendBtn.disabled = true;
                messageInput.value = "";

                let finalText = text;
                let finalReplyText = replyTo?.text || null;

                if (encryptionKey) {
                    finalText = await encryptText(text, encryptionKey);
                    if (finalReplyText) finalReplyText = await encryptText(finalReplyText, encryptionKey);
                }

                try {
                    const { data, error } = await db.rpc("send_message", {
                        p_payload: {
                            room: roomId,
                            nickname: currentUser,
                            text: finalText,
                            reply_nick: replyTo?.nick || null,
                            reply_text: finalReplyText || null,
                            file_url: null,
                            is_image: false,
                        },
                    });

                    if (error) {
                        showToast("Грешка при изпращане!");
                        messageInput.value = text;
                    } else if (data?.length) {
                        processedIds.add(data[0].id);
                        if (data[0].created_at && (!lastPollTimestamp || data[0].created_at > lastPollTimestamp)) {
                            lastPollTimestamp = data[0].created_at;
                        }
                        addMessageToScreen(data[0]);
                    }
                } catch (err) {
                    console.error("Send error:", err);
                    showToast("Грешка при изпращане!");
                    messageInput.value = text;
                }

                sendBtn.disabled = false;
                clearReply();
                messageInput.focus();
            }

            sendBtn.addEventListener("click", sendMessage);
            messageInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") sendMessage();
            });

            window.addEventListener("beforeunload", () => {
                if (realtimeChannel) realtimeChannel.untrack();
                stopLastSeenUpdates();
                stopPolling();
            });

            if (window.self !== window.top) {
                document.body.classList.add("is-iframe");
                const c = document.querySelector(".container");
                c.style.height = "100dvh";
                c.style.maxHeight = "none";
                c.style.borderRadius = "0";
                c.style.border = "none";
                c.style.boxShadow = "none";
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", initApp);
            } else {
                initApp();
            }
        </script>
    </body>
</html>
