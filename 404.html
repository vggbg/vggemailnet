         height: 100vh;

         text-align: center;

         #particles-js {

         }
         .background {
         position: absolute;
         top: 0;
         left: 0;
         width: 100%;
         height: 100%;

         animation: gentle-shift 12s ease-in-out infinite alternate;
         z-index: -3;
         opacity: 0.7;
         }
         @keyframes gentle-shift {
         0% {
         background-position: 0% 50%;
         filter: brightness(1);
         }
         100% {
         background-position: 100% 50%;
         filter: brightness(1.05);
         }
         }

         /* ===== БУТОН ЗА ИЗКЛЮЧВАНЕ НА ФОНА ===== */
         #toggleBgBtn {
            position: fixed;
            bottom: 60px; /* Повдигнат над футъра */
            left: 15px;
            z-index: 1001;

            border-radius: 50%;

            height: 44px;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);

            -webkit-backdrop-filter: blur(5px);
            transition: transform 0.2s, background 0.2s;
         }
         #toggleBgBtn:hover {
            transform: scale(1.1);
            background: #fff;
         }

         .text-container {
         position: relative;
         z-index: 1;
         max-width: 900px;
         padding: 35px 40px 40px 40px;
         background-color: rgba(255, 255, 255, 0.88);
         border-radius: 28px;
         box-shadow: 0 15px 50px rgba(0, 0, 0, 0.06), 0 5px 20px rgba(0, 0, 0, 0.03);
         backdrop-filter: blur(8px);
         border: 1px solid rgba(255, 255, 255, 0.8);
         transition: box-shadow 0.4s ease;
         }
         .text-container:hover {
         box-shadow: 0 20px 60px rgba(142, 68, 173, 0.08), 0 5px 20px rgba(0, 0, 0, 0.04);
         }
         .time-message {
         font-size: 2.4rem;
         font-weight: 400;
         margin: 35px 0 28px 0;
         position: relative;
         letter-spacing: 0.3px;
         color: #2d1b4e;
         animation: glitch-text 5s infinite linear alternate-reverse;
         line-height: 1.4;
         padding: 0 20px;
         min-height: 80px;
         display: flex;
         align-items: center;
         justify-content: center;
         }
         @keyframes glitch-text {
         0%, 100% { transform: translate(0); opacity: 1; }
         2% { transform: translate(-0.5px, 0.5px); }
         4% { transform: translate(0.5px, -0.5px); }
         6% { transform: translate(-0.5px, -0.5px); }
         8% { transform: translate(0.5px, 0.5px); }
         10% { transform: translate(-0.5px, 0.5px); }
         12% { transform: translate(0.5px, -0.5px); }
         14% { transform: translate(-0.5px, -0.5px); }
         16% { transform: translate(0.5px, 0.5px); }
         18% { transform: translate(-0.5px, 0.5px); }
         }
         .error-number {
         font-size: 12rem;
         font-weight: 700;
         margin: 5px 0 0 0;
         text-shadow: 0 2px 30px rgba(142, 68, 173, 0.12), 0 0 60px rgba(142, 68, 173, 0.05);
         animation: pulse 2.5s ease-in-out infinite, float 7s ease-in-out infinite;
         color: #2d1b4e;
         position: relative;
         display: inline-block;
         line-height: 1;
         }
         @keyframes pulse {
         0% { opacity: 0.85; transform: scale(1); }
         50% { opacity: 1; transform: scale(1.03); }
         100% { opacity: 0.85; transform: scale(1); }
         }
         @keyframes float {
         0%, 100% { transform: translateY(0px) rotate(0deg); }
         50% { transform: translateY(-14px) rotate(0.5deg); }
         }
         .interactive-dots {
         display: flex;
         justify-content: center;
         margin: 35px 0 25px 0;
         gap: 30px;
         cursor: pointer;
         }
         .dot {
         width: 38px;
         height: 38px;
         border-radius: 50%;
         position: relative;
         transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
         border: 2px solid rgba(255,255,255,0.6);
         cursor: pointer;
         }
         .dot.purple { 
         background: linear-gradient(135deg, #8e44ad, #a569bd); 
         box-shadow: 0 4px 15px rgba(142, 68, 173, 0.25); 
         }
         .dot.red { 
         background: linear-gradient(135deg, #e74c3c, #ec7063); 
         box-shadow: 0 4px 15px rgba(231, 76, 60, 0.25); 
         }
         .dot.orange { 
         background: linear-gradient(135deg, #f39c12, #f7b731); 
         box-shadow: 0 4px 15px rgba(243, 156, 18, 0.25); 
         }
         .dot.cyan { 
         background: linear-gradient(135deg, #0de6fc, #4ef0ff); 
         box-shadow: 0 4px 15px rgba(13, 230, 252, 0.25); 
         }
         .dot:hover {
         transform: scale(1.25) rotate(8deg);
         box-shadow: 0 8px 30px;
         }
         .connected {
         animation: connect 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
         }
         @keyframes connect {
         0% { transform: scale(1); }
         30% { transform: scale(1.5) rotate(10deg); }
         60% { transform: scale(0.9) rotate(-5deg); }
         100% { transform: scale(1) rotate(0deg); }
         }
         /* ===== МОДАЛ ЗА КОНТАКТНА ФОРМА И ЧАТ ===== */
         .modal-overlay {
         display: none;
         position: fixed;
         inset: 0;
         background: rgba(0,0,0,0.35);
         backdrop-filter: blur(4px);
         -webkit-backdrop-filter: blur(4px);
         justify-content: center;
         align-items: center;
         z-index: 9999;
         padding: 16px;
         }
         .modal-overlay.active {
         display: flex;
         }
         .modal {
         background: #fff;
         max-width: 520px;
         width: 100%;
         border-radius: 28px;
         padding: 24px 24px 28px;
         box-shadow: 0 30px 60px rgba(0,0,0,0.2);
         animation: modalFade 0.25s;
         max-height: 92vh;
         overflow-y: auto;
         }
         @keyframes modalFade {
         from { opacity: 0; transform: scale(0.95); }
         to { opacity: 1; transform: scale(1); }
         }
         .modal.contact-modal {
         max-width: 750px;
         }
         .contact-modal iframe {
         width: 660px;
         height: 700px;
         max-width: 100%;
         border: none;
         border-radius: 12px;
         background: #fff;
         }
         .contact-modal .modal-actions {
         margin-top: 16px;
         }
         .modal h2 {
         font-size: 1.4rem;
         font-weight: 600;
         margin-bottom: 20px;
         color: #1e2b37;
         text-align: left;
         font-family: 'Arsenal', sans-serif;
         }
         .modal-actions {
         display: flex;
         gap: 10px;
         justify-content: flex-end;
         margin-top: 24px;
         flex-wrap: wrap;
         }
         .modal .btn {
         padding: 10px 24px;
         border: none;
         border-radius: 40px;
         font-weight: 600;
         font-size: 0.9rem;
         cursor: pointer;
         transition: 0.2s;
         font-family: 'Arsenal', sans-serif;
         }
         .btn-outline {
         background: transparent;
         border: 1px solid #d0d9df;
         color: #1e2b37;
         }
         .btn-outline:hover {
         background: #e9edf0;
         }
         .btn-primary {
         background: #8e44ad;
         color: white;

         }

         background: #7d3c98;
         }
         .footer {

         left: 0;
         bottom: 0;
         width: 100%;
         height: 44px;
         background: rgba(255, 255, 255, 0.9);
         font-family: "Arsenal", sans-serif;
         font-size: 14px;
         color: #2d1b4e;
         text-align: center;
         padding-top: 13px;
         border-top: 1px solid rgba(0, 0, 0, 0.05);

         backdrop-filter: blur(10px);
         -webkit-backdrop-filter: blur(10px);
         }
         .footer a, .footer span.link-like {

         text-decoration: none;
         margin: 0 18px;
         transition: all 0.3s ease;
         position: relative;
         font-weight: 500;
         opacity: 0.8;
         cursor: pointer;
         }
         .footer a:hover, .footer span.link-like:hover {
         color: #8e44ad;
         opacity: 1;
         text-shadow: 0 0 20px rgba(142, 68, 173, 0.15);
         }
         .footer a::after, .footer span.link-like::after {
         content: '';
         position: absolute;
         width: 0;
         height: 2px;
         bottom: -4px;
         left: 0;
         background: linear-gradient(90deg, #8e44ad, #a569bd);
         transition: width 0.35s ease;
         }
         .footer a:hover::after, .footer span.link-like:hover::after {
         width: 100%;
         }
         .easter-egg-activated .text-container {
         animation: rainbow-border 2s infinite;
         }
         @keyframes rainbow-border {
         0% { box-shadow: 0 0 50px rgba(255, 0, 255, 0.15); }
         25% { box-shadow: 0 0 50px rgba(0, 255, 255, 0.15); }
         50% { box-shadow: 0 0 50px rgba(255, 153, 0, 0.15); }
         75% { box-shadow: 0 0 50px rgba(142, 68, 173, 0.15); }
         100% { box-shadow: 0 0 50px rgba(255, 0, 255, 0.15); }
         }
         #interactive-message {
         transition: all 0.4s ease;
         font-weight: 400;
         }
         @media (max-width: 768px) {
         .error-number { font-size: 8rem; }
         .time-message { 
         font-size: 1.8rem; 
         min-height: 60px;
         padding: 0 15px;
         }
         .text-container { 
         max-width: 94%; 
         padding: 25px 20px 30px 20px;
         margin: 0 10px;
         }
         .dot { width: 32px; height: 32px; }
         .interactive-dots { gap: 22px; margin: 30px 0 20px 0; }
         .footer { height: 52px; padding-top: 16px; font-size: 13px; }
         .footer a, .footer span.link-like { display: inline-block; margin: 4px 12px; }
         .modal.contact-modal {
         max-width: 95%;
         margin: 10px;
         }
         .contact-modal iframe {
         height: 500px;
         }
         .modal h2 {
         font-size: 1.2rem;
         }
         }
         @media (max-width: 480px) {
         .error-number { font-size: 5.5rem; }
         .time-message { 
         font-size: 1.4rem; 
         min-height: 50px;
         padding: 0 10px;
         line-height: 1.3;
         }
         .text-container { 
         max-width: 96%; 
         padding: 20px 15px 25px 15px;

         border-radius: 20px;
         }
         .interactive-dots { gap: 16px; margin: 25px 0 18px 0; }

         @media (max-width: 360px) {

         .dot { width: 24px; height: 24px; }
         .interactive-dots { gap: 12px; }
         }
      </style>
   </head>
   <body>
      <!-- ===== БУТОН ЗА ФОН ===== -->
      <button id="toggleBgBtn" title="Включи/Изключи фоновия ефект">⚒️</button>

      <div id="particles-js"></div>
      <div class="background"></div>
      
      <!-- ===== МОДАЛ ЗА КОНТАКТНА ФОРМА ===== -->
      <div class="modal-overlay" id="contactModal">
         <div class="modal contact-modal">
            <h2>Формуляр за Контакт</h2>
            <iframe id="contactIframe" src="about:blank" style="width:100%; height:660px; border:none; border-radius:12px; background:#fff;"></iframe>
            <div class="modal-actions">
               <button class="btn btn-outline" onclick="closeContactModal()">Затвори</button>

      <!-- ===== МОДАЛ ЗА ЧАТ (НОВ) ===== -->
      <div class="modal-overlay" id="chatModal">

            <!-- Намаляваме разстоянието отдолу на 5px (изначало е било 20px) -->
            <h2 style="margin-bottom: 0px;">Коментари</h2>
            
            <div style="width:100%; max-width:100%; overflow:hidden; border-radius:12px; line-height: 0;">
                <!-- Увеличаваме височината на фрейма от 600px на 615px, за да компенсираме премахнатите 15 пиксела разстояние. Също така display:block премахва базовото разстояние на iframe -->
                <iframe id="chatIframe" src="about:blank" style="width:100%; height:615px; border:none; overflow:hidden; background:#fff; display:block;" allow="clipboard-write"></iframe>
            </div>
            
            <div class="modal-actions">
               <button class="btn btn-outline" onclick="closeChatModal()">Затвори</button>
            </div>
         </div>
      </div>
      
      <div class="text-container">
         <div class="error-number">404</div>
         <div class="time-message" id="time-message"></div>
         <div class="interactive-dots" id="interactive-dots">
            <div class="dot purple" data-color="purple"></div>
            <div class="dot red" data-color="red"></div>
            <div class="dot orange" data-color="orange"></div>
            <div class="dot cyan" data-color="cyan"></div>
         </div>
         <div id="interactive-message" style="margin-top: 20px; font-size: 1.2rem; opacity: 0.85; min-height: 30px; color: #4a4a6a;">

         </div>

      <div class="footer">
         <a href="#" onclick="openContactModal(); return false;">
            <i class="fas fa-envelope"></i> контактна форма
         </a>
         | 
         <span class="link-like" onclick="openChatModal();">
            <i class="fas fa-comments"></i> коментари
         </span> 
         | 
         <a href="https://t.me/+7_XRl0bzOYFlMWVk" target="_blank">
            <i class="fab fa-telegram"></i> telegram
         </a>

      <!-- ===== ФУНКЦИИ ЗА КОНТАКТНАТА ФОРМА И ЧАТ МОДАЛА ===== -->
      <script type="text/javascript">
         // Контактна форма
         function openContactModal() {
             const modal = document.getElementById('contactModal');
             const iframe = document.getElementById('contactIframe');
             iframe.src = 'https://forms.zohopublic.com/virtualoffice6913/form/ContactForm1/formperma/bJ2K6HfG3130MM7bMkB628053';
             modal.classList.add('active');
             document.body.style.overflow = 'hidden';
         }

         function closeContactModal() {
             const modal = document.getElementById('contactModal');
             modal.classList.remove('active');
             document.body.style.overflow = '';
             document.getElementById('contactIframe').src = 'about:blank';
         }

         // Чат модал
         function openChatModal() {
             const modal = document.getElementById('chatModal');
             const iframe = document.getElementById('chatIframe');
             iframe.src = 'https://vggemail.net/chat/?room=comments';
             modal.classList.add('active');
             document.body.style.overflow = 'hidden';
         }

         function closeChatModal() {
             const modal = document.getElementById('chatModal');
             modal.classList.remove('active');
             document.body.style.overflow = '';
             document.getElementById('chatIframe').src = 'about:blank';
         }

         // Затваряне при клик върху overlay
         document.addEventListener('DOMContentLoaded', function() {
             const contactModal = document.getElementById('contactModal');
             const chatModal = document.getElementById('chatModal');
             
             if (contactModal) {
                 contactModal.addEventListener('click', function(e) {
                     if (e.target === this) closeContactModal();
                 });
             }
             if (chatModal) {
                 chatModal.addEventListener('click', function(e) {
                     if (e.target === this) closeChatModal();
                 });
             }

             // Бутон за фона
             const toggleBgBtn = document.getElementById('toggleBgBtn');
             const particlesDiv = document.getElementById('particles-js');
             const bgDiv = document.querySelector('.background');
             let isBgActive = true;

             toggleBgBtn.addEventListener('click', function() {
                 if (isBgActive) {
                     particlesDiv.style.display = 'none';
                     bgDiv.style.display = 'none';
                     document.body.style.background = '#ffffff';
                     isBgActive = false;
                 } else {
                     particlesDiv.style.display = 'block';
                     bgDiv.style.display = 'block';
                     document.body.style.background = '';
                     isBgActive = true;
                 }
             });
         });

         // Затваряне с ESC
         document.addEventListener('keydown', function(e) {
             if (e.key === 'Escape') {
                 closeContactModal();
                 closeChatModal();
             }
         });
      </script>
      
      <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
      <script>
         document.addEventListener('DOMContentLoaded', function() {
             particlesJS("particles-js", {
                 particles: {
                     number: { value: 50, density: { enable: true, value_area: 800 } },
                     color: { value: ["#8e44ad", "#e74c3c", "#f39c12", "#0de6fc", "#35aeff"] },
                     shape: { type: "circle" },
                     opacity: { value: 0.4, random: true },
                     size: { value: 3, random: true },
                     line_linked: {
                         enable: true,
                         distance: 150,

                         width: 1
                     },

                         enable: true,

             setMessageByTime();
             setupInteractiveDots();
             // Великденското яйце е ПРЕМАХНАТО
         });
         
         function setMessageByTime() {
             const hour = new Date().getHours();
             const messageElement = document.getElementById('time-message');
             
             const userLang = navigator.language || navigator.userLanguage;
             const langCode = userLang.substring(0, 2).toLowerCase();
             const isChinese = userLang.includes('zh') || langCode === 'zh';
             
             let currentLang = 'en';
             if (langCode === 'bg') currentLang = 'bg';
             else if (langCode === 'ru') currentLang = 'ru';
             else if (isChinese) currentLang = 'zh';

                 zh: {
                     night: "🌙 即使在黑暗中我们也找不到您要找的页面...",

                     afternoon: "🔍 页面消失在网络中...",
                     evening: "🌟 连星星都找不到您要找的页面..."
                 }
             };
             
             let timeOfDay = 'afternoon';
             
             if (hour >= 0 && hour < 6) timeOfDay = 'night';
             else if (hour >= 6 && hour < 12) timeOfDay = 'morning';
             else if (hour >= 12 && hour < 18) timeOfDay = 'afternoon';
             else timeOfDay = 'evening';
             
             messageElement.textContent = timeMessages[currentLang][timeOfDay];
         }
         
         function setupInteractiveDots() {
             const dots = document.querySelectorAll('.dot');
             const messageElement = document.getElementById('interactive-message');
             let connectedCount = 0;
             
             const userLang = navigator.language || navigator.userLanguage;
             const langCode = userLang.substring(0, 2).toLowerCase();
             const isChinese = userLang.includes('zh') || langCode === 'zh';
             
             let currentLang = 'en';
             if (langCode === 'bg') currentLang = 'bg';
             else if (langCode === 'ru') currentLang = 'ru';
             else if (isChinese) currentLang = 'zh';
             
             const interactiveMessages = {
                 bg: {
                     start: "🌸 Цъкни върху точките, за да ги свържеш",
                     progress1: "✨ Продължавай! Свържи всички точки...",

                 ru: {

                     progress2: "🌟 Еще одна... почти готово!",
                     progress3: "🎯 Последняя точка! Нажмите!",
                     complete: "✅ Все точки соединены! Но страница всё ещё отсутствует..."
                 },
                 zh: {
                     start: "🌸 点击圆点以连接它们",
                     progress1: "✨ 继续！连接所有圆点...",
                     progress2: "🌟 还有一个... 快完成了！",
                     progress3: "🎯 最后一个点！点击它！",
                     complete: "✅ 所有圆点已连接！但页面仍然丢失..."
                 }
             };
             
             messageElement.textContent = interactiveMessages[currentLang].start;
             
             dots.forEach(dot => {
                 dot.addEventListener('click', function() {
                     if (!this.classList.contains('connected')) {
                         this.classList.add('connected');
                         connectedCount++;
                         
                         const color = this.getAttribute('data-color');
                         this.style.boxShadow = `0 0 40px ${getColorHex(color)}, 0 0 80px ${getColorHex(color)}40`;
                         
                         if (connectedCount === 1) {
                             messageElement.textContent = interactiveMessages[currentLang].progress1;
                             messageElement.style.color = getColorHex(color);
                         } else if (connectedCount === 2) {
                             messageElement.textContent = interactiveMessages[currentLang].progress2;
                             messageElement.style.color = '#f39c12';
                         } else if (connectedCount === 3) {
                             messageElement.textContent = interactiveMessages[currentLang].progress3;
                             messageElement.style.color = '#e74c3c';
                         } else if (connectedCount === 4) {
                             messageElement.textContent = interactiveMessages[currentLang].complete;
                             messageElement.style.color = '#8e44ad';
                             messageElement.style.textShadow = '0 0 20px rgba(142, 68, 173, 0.15)';
                             
                             setTimeout(() => {
                                 document.querySelector('.text-container').style.animation = 'rainbow-border 1s 3';
                             }, 300);
                         }
                     }
                 });
             });
             
             function getColorHex(colorName) {
                 const colors = {
                     purple: '#8e44ad',
                     red: '#e74c3c',
                     orange: '#f39c12',
                     cyan: '#0de6fc'
                 };
                 return colors[colorName] || '#4a4a6a';
             }
         }
